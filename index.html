<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polyrhythm Metronome</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Polyrhythm Metronome</h1>
  <div class="container">
    <label>Main Rhythm (Beats / Note):</label>
    <div class="flex-row">
      <input type="number" id="mainTop" step="any" value="4" /> /
      <input type="number" id="mainBottom" step="any" value="4" />
    </div>

    <label>Main Measures:</label>
    <input type="number" id="mainMeasures" value="10" />

    <label>Main BPM:</label>
    <input type="number" id="mainBPM" value="120" />

    <hr />

    <label>Polyrhythm (Beats / Note):</label>
    <div class="flex-row">
      <input type="number" id="polyTop" step="any" value="6" /> /
      <input type="number" id="polyBottom" step="any" value="8" />
    </div>

    <label>Polyrhythm Measures:</label>
    <input type="number" id="polyMeasures" value="8" />

    <label>Polyrhythm BPM:</label>
    <input type="number" id="polyBPM" readonly />

    <button id="startStopBtn">Start</button>
    <div id="resultBPM"></div>
  </div>

  <div class="footer">Created by ChatGPT</div>

  <script src="script.js"></script>
</body>
</html>
