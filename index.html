<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Polyrhythm Metronome</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">
</head>
<body>
  <h1>PolyMetronome</h1>

  <!-- 🔹 بخش مترونوم اصلی -->
  <div class="container">
    <h2>Main Rhythm</h2>

    <label>Pattern (e.g. 2+3+2):</label>
    <input type="text" id="mainPattern" value="2+3+2" />

    <label>Repeat Count (before polyrhythms):</label>
    <input type="number" id="mainRepeats" value="5" min="1" />

    <label>Main BPM:</label>
<div class="bpm-control">
      <button id="bpmDecrease">-</button>
      <input type="range" id="mainBPM" min="10" max="600" value="120" />
      <button id="bpmIncrease">+</button>
      <span id="bpmDisplay">120 BPM</span>
    </div>
  </div>

  <!-- 🔹 بخش پلی‌ریتم‌ها -->
  <div class="container">
    <h2>Polyrhythms</h2>
    <div id="polyrhythmList"></div>
    <button id="addPolyrhythm">+ Add Polyrhythm</button>
  </div>


  <script src="script.js"></script>
</body>
</html>
